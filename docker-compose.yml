services:
  app:
    build:
      context: .
      args:
        ACCESS_KEY: ${ACCESS_KEY}
        VITE_TELEGRAM_BOT_USERNAME: ${VITE_TELEGRAM_BOT_USERNAME:-}
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_PATH: ./data/moneyflow.db
      WEB_ORIGIN: ${WEB_ORIGIN}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    expose:
      - "3000"

  caddy:
    image: caddy:2
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
